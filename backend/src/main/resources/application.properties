# Spring Boot Configuration
spring.application.name=interview-platform-backend
server.port=8080

# Database Configuration
# Default is H2 in-memory for local development.
# To use MySQL, activate the mysql profile: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging
logging.level.root=INFO
logging.level.com.interview.platform=DEBUG
logging.level.org.springframework.web=DEBUG

# JWT Configuration
jwt.secret=your_jwt_secret_key_change_this_in_production_environment_with_strong_key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload Configuration
file.upload-dir=uploads/resumes
file.max-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gemini API Configuration
gemini.api-key=AQ.Ab8RN6JrELtJ8tzAW1vSth69l59l5BTNR4pwLc7Dylh3Fka07g
gemini.api-url=https://api.openai.com/v1/chat/completions
gemini.model=gpt-4o-mini

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:4173,http://127.0.0.1:4174
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
